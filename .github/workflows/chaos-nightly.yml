name: Chaos nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  chaos:
    name: 1000 kill-mid-write iterations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools-rust>=1.8.0"
          pip install -e ".[dev]"
      - name: Failure rate, including a zero
        run: python scripts/chaos_resume.py --iterations 1000 --out artifacts/chaos-failure-rate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-failure-rate
          path: artifacts/chaos-failure-rate.json
