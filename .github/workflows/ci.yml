name: CI

on:
  push:
    branches: ["dev", "staging", "cloud", "prod", "main", "master"]
  pull_request:
    branches: ["dev", "staging", "cloud", "prod", "main", "master"]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Core test matrix — runs on every supported Python version.
  # Uses only the base `pip install omem-os` dependencies (no extras) to
  # prove the package works out-of-the-box without anything extra.
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # Also smoke-test on macOS and Windows with the latest Python
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install package + dev dependencies (with extras for full coverage)
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools-rust>=1.8.0"
          pip install -e ".[dev,fast,mcp,langchain]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Test with pytest
        run: pytest tests/ -v --tb=short --junitxml=pytest-results.xml

      - name: Summarize pytest failures
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          path = "pytest-results.xml"
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = ["## Pytest failures", ""]
          if not os.path.exists(path):
              lines.append("_No pytest-results.xml (collection/install failure?)._")
          else:
              root = ET.parse(path).getroot()
              failed = []
              for case in root.iter("testcase"):
                  bad = case.find("failure")
                  if bad is None:
                      bad = case.find("error")
                  if bad is None:
                      continue
                  name = f"{case.get('classname')}::{case.get('name')}"
                  msg = (bad.get("message") or bad.text or "").strip().splitlines()
                  failed.append((name, msg[0] if msg else "failed"))
              if not failed:
                  lines.append("_JUnit present but no failure/error nodes._")
              else:
                  lines.append(f"{len(failed)} failed/errored test(s):")
                  lines.append("")
                  for name, msg in failed[:50]:
                      lines.append(f"- `{name}` — {msg[:240]}")
          text = "\n".join(lines) + "\n"
          print(text)
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text)
          PY

  # ──────────────────────────────────────────────────────────────────────────
  # Bare install smoke-test — verifies `pip install omem-os` with ZERO extras
  # works identically to a fresh user install (no Rust, no ML libraries).
  # ──────────────────────────────────────────────────────────────────────────
  bare_install:
    name: Bare install smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with base deps only (no Rust, no extras)
        # Deliberately do NOT install setuptools-rust or any optional extras.
        # This mirrors exactly what `pip install omem-os` does for an end-user
        # who just wants to get started.
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify core functionality works without extras
        run: |
          python - <<'EOF'
          from omem import OMem, __version__
          print("version:", __version__)
          m = OMem()
          mid = m.add("Hello from bare install test")
          results = m.recall("Hello")
          assert len(results) > 0, "recall returned nothing"
          assert results[0].content == "Hello from bare install test"
          print("bare install OK — add/recall work without any extras")
          EOF

  claims:
    name: Claims ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fail if a claim tag or proof path breaks
        run: python scripts/check_claims.py

  chaos:
    name: Chaos and isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools-rust>=1.8.0"
          pip install -e ".[dev]"
      - name: Kill mid-write, 20 iterations, report the failure rate
        run: python scripts/chaos_resume.py --iterations 20 --out artifacts/chaos-failure-rate.json
      - name: Adversarial namespace isolation
        run: pytest tests/test_adversarial_isolation.py tests/test_state_namespace_isolation.py tests/test_chaos_resume.py -q --tb=short
