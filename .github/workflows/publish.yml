name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pretend (e.g. 0.0.3) when manually re-running"
        required: false
        default: ""

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Binary wheels (with Rust extension)
  # Reliable matrix for tech-preview releases (CPython 3.9–3.13):
  #   Linux manylinux x86_64 · macOS x86_64/arm64/universal2 · Windows AMD64
  # No QEMU aarch64 (starves GHA runners). Other platforms use the sdist.
  # ──────────────────────────────────────────────────────────────────────────
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ""
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            echo "ERROR: set workflow_dispatch version= or push a v* tag" >&2
            exit 1
          fi
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "ERROR: invalid version '$VER' (expected semver like 0.0.3)" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> $GITHUB_ENV
          echo "Publishing version: $VER"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS cross-compilation targets
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.17.0
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"

          # Native Linux x86_64 only — QEMU aarch64 previously killed the runner.
          CIBW_ARCHS_LINUX: "x86_64"

          # macOS: native x86_64 + arm64 + universal2 fat binary
          CIBW_ARCHS_MACOS: "x86_64 arm64 universal2"

          # Windows AMD64 only (win_arm64 cross-compile is unreliable here)
          CIBW_ARCHS_WINDOWS: "AMD64"

          CIBW_BEFORE_ALL_LINUX: >
            curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain stable -y &&
            . "$HOME/.cargo/env"

          CIBW_BEFORE_BUILD: "pip install setuptools-rust>=1.8.0"

          CIBW_ENVIRONMENT: >-
            PATH="$PATH:$HOME/.cargo/bin"
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.RELEASE_VERSION }}
            PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1

          CIBW_ENVIRONMENT_MACOS: >-
            PATH="$PATH:$HOME/.cargo/bin"
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.RELEASE_VERSION }}
            MACOSX_DEPLOYMENT_TARGET="10.13"
            PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1

          CIBW_ENVIRONMENT_WINDOWS: >-
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.RELEASE_VERSION }}
            PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1

          CIBW_SKIP: "pp*"
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  # ──────────────────────────────────────────────────────────────────────────
  # Source distribution (pure-Python fallback, no Rust required)
  # This is what pip falls back to on any platform not covered by a wheel.
  # The sdist build intentionally does NOT install setuptools-rust so that
  # the resulting sdist compiles cleanly everywhere.
  # ──────────────────────────────────────────────────────────────────────────
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            echo "ERROR: set workflow_dispatch version= or push a v* tag" >&2
            exit 1
          fi
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "ERROR: invalid version '$VER'" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist (pure Python — no Rust toolchain needed)
        run: pipx run build --sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ env.RELEASE_VERSION }}

      - name: Smoke-test sdist installs cleanly
        run: |
          pip install dist/*.tar.gz
          python - <<'EOF'
          import os
          import omem
          expected = os.environ["RELEASE_VERSION"]
          print("sdist install OK, version:", omem.__version__)
          assert omem.__version__ == expected or omem.__version__.startswith(expected + "."), (
              f"version mismatch: {omem.__version__!r} vs {expected!r}"
          )
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # ──────────────────────────────────────────────────────────────────────────
  # Publish everything to PyPI once both jobs succeed
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true
