repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/
      - id: end-of-file-fixer
        exclude: ^tests/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(tests/|benchmarks/)

  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        language_version: python3.9
        exclude: ^(tests/|benchmarks/)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        exclude: ^(tests/|benchmarks/|examples/)
        args: [--ignore-missing-imports, --no-strict-optional]

  - repo: local
    hooks:
      - id: no-commit-secrets
        name: check for secrets in commit
        entry: bash -c 'if git diff --cached | grep -iE "(api_key|secret_key|password|token|bearer)" | grep -v "OMEM_"; then exit 1; fi'
        language: system
        pass_filenames: false
      - id: block-llm-coauthor
        name: Block LLM Co-authors
        entry: bash -c 'if grep -iE "^Co-authored-by:.*(Claude|Cursor|Copilot|AI|Anthropic|GitHub)" "$1"; then echo "Error: LLM Co-authors are not allowed. Please remove them from the commit message."; exit 1; fi' --
        language: system
        stages: [commit-msg]
