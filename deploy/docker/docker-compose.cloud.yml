version: "3.9"

# OMem Cloud — local Docker stack with Postgres
# Mirrors Linode topology: API + PostgreSQL (+ optional worker profile).
#
# Quick start:
#   cp .env.cloud.example .env.cloud
#   ./deploy/scripts/cloud-docker-up.sh
#
# Test:
#   curl http://localhost:8080/v1/health
#   open http://localhost:8080/docs
#
# Same image/env deploys to Linode via cloud-proof-deploy.sh (Postgres on DBaaS).

services:
  omem-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.cloud
    image: omem-cloud:latest
    container_name: omem-cloud-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../../.env.cloud
    environment:
      OMEM_CLOUD_MODE: "1"
      OMEM_BACKEND: postgres
      OMEM_DB_URL: postgresql://omem:omem@omem-db:5432/omem
      OMEM_STATE_DB_PATH: /data/omem_state.db
      OMEM_AUDIT_DB_PATH: /data/omem_audit.db
      OMEM_RUNTIME_DB_PATH: /data/omem_runtime.db
    volumes:
      - omem-cloud-sidecar:/data
    depends_on:
      omem-db:
        condition: service_healthy
    networks:
      - omem-cloud-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  omem-db:
    image: postgres:16-alpine
    container_name: omem-cloud-db
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: omem
      POSTGRES_PASSWORD: omem
      POSTGRES_DB: omem
    volumes:
      - omem-cloud-db-data:/var/lib/postgresql/data
    networks:
      - omem-cloud-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omem -d omem"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Full Linode topology includes a worker node — enable when omem.cloud.worker ships:
  # docker compose -f deploy/docker/docker-compose.cloud.yml --profile worker up
  omem-worker:
    profiles: ["worker"]
    image: omem-cloud:latest
    container_name: omem-cloud-worker
    restart: unless-stopped
    env_file:
      - ../../.env.cloud
    environment:
      OMEM_CLOUD_MODE: "1"
      OMEM_WORKER_MODE: "1"
      OMEM_BACKEND: postgres
      OMEM_DB_URL: postgresql://omem:omem@omem-db:5432/omem
    depends_on:
      omem-db:
        condition: service_healthy
    networks:
      - omem-cloud-net
    command: ["python", "-c", "import time; print('worker stub — sleep/retention jobs TBD'); time.sleep(999999)"]

volumes:
  omem-cloud-db-data:
  omem-cloud-sidecar:

networks:
  omem-cloud-net:
    driver: bridge
