version: "3.9"

# OMem Cloud — production-grade Docker stack
#
# Default services:  nginx (TLS proxy) + omem-api + omem-db + omem-worker
# Monitoring profile: docker compose --profile monitoring up
#
# Quick start:
#   cp .env.cloud.example .env.cloud   # edit POSTGRES_PASSWORD + OMEM_API_KEY
#   ./deploy/scripts/cloud-docker-up.sh
#
# Test:
#   curl http://localhost/v1/health       # via nginx HTTP
#   curl https://localhost/v1/health -k  # via nginx HTTPS (self-signed)
#   open http://localhost/docs
#
# Monitoring:
#   docker compose -f deploy/docker/docker-compose.cloud.yml --profile monitoring up
#   open http://localhost:3000   # Grafana  (admin / admin)
#   open http://localhost:9090   # Prometheus

services:

  # ── Reverse proxy + TLS ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: omem-cloud-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - omem-cloud-certs:/etc/nginx/certs
    depends_on:
      omem-api:
        condition: service_healthy
    networks:
      - omem-cloud-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── API ───────────────────────────────────────────────────────────────────────
  omem-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.cloud
    image: omem-cloud:latest
    container_name: omem-cloud-api
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - ../../.env.cloud
    environment:
      OMEM_CLOUD_MODE: "1"
      OMEM_BACKEND: postgres
      OMEM_STATE_DB_PATH: /data/omem_state.db
      OMEM_AUDIT_DB_PATH: /data/omem_audit.db
      OMEM_RUNTIME_DB_PATH: /data/omem_runtime.db
    volumes:
      - omem-cloud-sidecar:/data
    depends_on:
      omem-db:
        condition: service_healthy
    networks:
      - omem-cloud-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Database ─────────────────────────────────────────────────────────────────
  omem-db:
    image: postgres:16-alpine
    container_name: omem-cloud-db
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200", "-c", "log_min_duration_statement=1000"]
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-omem}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
      POSTGRES_DB: "${POSTGRES_DB:-omem}"
    volumes:
      - omem-cloud-db-data:/var/lib/postgresql/data
    networks:
      - omem-cloud-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omem} -d ${POSTGRES_DB:-omem}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Background worker (always on) ────────────────────────────────────────────
  omem-worker:
    image: omem-cloud:latest
    container_name: omem-cloud-worker
    restart: unless-stopped
    env_file:
      - ../../.env.cloud
    environment:
      OMEM_CLOUD_MODE: "1"
      OMEM_WORKER_MODE: "1"
      OMEM_BACKEND: postgres
      OMEM_ENDPOINT: http://omem-api:8080
    depends_on:
      omem-api:
        condition: service_healthy
      omem-db:
        condition: service_healthy
    networks:
      - omem-cloud-net
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/1/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["python3", "-m", "omem.cloud.worker"]

  # ── Prometheus (--profile monitoring) ────────────────────────────────────────
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: omem-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - omem-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - omem-cloud-net

  # ── Grafana (--profile monitoring) ───────────────────────────────────────────
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: omem-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
    volumes:
      - omem-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - omem-cloud-net

volumes:
  omem-cloud-db-data:
  omem-cloud-sidecar:
  omem-cloud-certs:
  omem-prometheus-data:
  omem-grafana-data:

networks:
  omem-cloud-net:
    driver: bridge
