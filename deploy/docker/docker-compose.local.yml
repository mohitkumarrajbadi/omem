version: "3.9"

# OMem — local Docker stack (Postgres-backed memory, production topology)
# Same shape as cloud compose; ideal for dev before Linode deploy.
#
# Usage:
#   cp .env.cloud.example .env.cloud   # if not already present
#   docker compose -f deploy/docker/docker-compose.local.yml up --build
#
# Test:
#   curl http://localhost:8080/v1/health
#   ./deploy/scripts/cloud-docker-smoke.sh

services:
  omem-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.local
    image: omem-local:latest
    container_name: omem-local-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../../.env.cloud
    environment:
      OMEM_CLOUD_MODE: "1"
      OMEM_BACKEND: postgres
      OMEM_DB_URL: postgresql://omem:omem@omem-db:5432/omem
      OMEM_STATE_DB_PATH: /data/omem_state.db
      OMEM_AUDIT_DB_PATH: /data/omem_audit.db
      OMEM_RUNTIME_DB_PATH: /data/omem_runtime.db
      OMEM_NAMESPACE: default
      OMEM_LOG_LEVEL: INFO
      OMEM_API_KEY: ${OMEM_API_KEY:-}
    volumes:
      - omem-local-sidecar:/data
    depends_on:
      omem-db:
        condition: service_healthy
    networks:
      - omem-local-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  omem-db:
    image: postgres:16-alpine
    container_name: omem-local-db
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: omem
      POSTGRES_PASSWORD: omem
      POSTGRES_DB: omem
    volumes:
      - omem-local-db-data:/var/lib/postgresql/data
    networks:
      - omem-local-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omem -d omem"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  omem-local-db-data:
  omem-local-sidecar:

networks:
  omem-local-net:
    driver: bridge
