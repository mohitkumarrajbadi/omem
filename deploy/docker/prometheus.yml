global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: omem-cloud
    env: docker

scrape_configs:
  - job_name: omem-api
    static_configs:
      - targets: ["omem-api:8080"]
    metrics_path: /v1/metrics
    scrape_interval: 10s

  - job_name: postgres
    static_configs:
      - targets: ["omem-db:5432"]
    scrape_interval: 30s
