[build-system]
# setuptools-rust is required at build time to register the 'rust_extensions' entrypoint.
# The actual compilation of the Rust extension is guarded by the presence of 'rustc' on PATH in setup.py.
# If 'rustc' is missing, it builds/installs silently as a pure Python fallback without issues.
requires = ["setuptools>=68.0", "wheel", "setuptools-scm>=8.0", "setuptools-rust>=1.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omem*"]

[project]
name = "omem-os"
dynamic = ["version"]
description = "Governed Agent Memory — prove what agents knew, when, and who can see it. Memory, state, audit, retention, and tenant hardening for production agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Mohit Kumar Rajbadi", email = "mohitkumarrajbadi@gmail.com"}
]
keywords = [
    "ai", "agent-state", "memory", "rag", "vector-search", "embeddings",
    "llm", "agents", "state-management", "checkpointing", "memory-os",
    "multi-agent", "agentic-ai", "context-optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
# numpy: no upper bound — works with 1.x and 2.x
# xxhash: small, pure-C wheel available for all platforms; hashlib fallback is
#         already in code so the package also works without it if needed
dependencies = [
    "numpy>=1.24.0",
    "click>=8.0.0",
    "xxhash>=3.0.0",
    "mcp>=1.0.0; python_version >= '3.10'",
]

[project.optional-dependencies]
# Compiled acceleration: FAISS vector index + Numba JIT scoring
fast = [
    "faiss-cpu>=1.7.4",
    "numba>=0.58.0",
]
# Local ML embeddings (downloads ~90 MB model on first use)
# Without this the built-in hash-based embedder is used automatically.
embeddings = ["sentence-transformers>=2.2.0"]
# Document ingest (PDF text extraction; markdown/HTML need no extra deps)
ingest = ["pypdf>=4.0"]
# LangGraph checkpointer / store extras (adapters work without this installed)
langgraph = ["langgraph>=0.2.0"]
# PostgreSQL distributed backend
postgres = ["psycopg2-binary>=2.9.0"]
# MCP server for Claude Desktop / Cursor integration
mcp = ["mcp>=1.0.0; python_version >= '3.10'"]
# AES-256-GCM field-level encryption at rest
secure = ["cryptography>=41.0.0"]
# LangChain retriever / memory adapter
langchain = ["langchain>=0.1.0"]
# LlamaIndex integration adapter
llama_index = ["llama-index>=0.6.0"]
# Mem0 governance adapter — semantic store stays in Mem0; OMem audits it
mem0 = ["mem0ai>=0.1.0"]
# OpenAI embeddings provider
openai = ["openai>=1.0.0"]
# AI memory benchmark dependencies
benchmarks = [
    "mteb>=0.6.0",
    "beir>=0.2.0",
    "datasets>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
]
# Development and testing
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
]
# Everything at once (for power users / CI)
all = [
    "faiss-cpu>=1.7.4",
    "numba>=0.58.0",
    "sentence-transformers>=2.2.0",
    "psycopg2-binary>=2.9.0",
    "mcp>=1.0.0; python_version >= '3.10'",
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
omem = "omem.cli:main"

[project.urls]
Homepage = "https://github.com/mohitkumarrajbadi/omem"
Repository = "https://github.com/mohitkumarrajbadi/omem"
Issues = "https://github.com/mohitkumarrajbadi/omem/issues"
Changelog = "https://github.com/mohitkumarrajbadi/omem/releases"

[tool.setuptools_scm]
# Dynamic version from git tags (v0.0.N → 0.0.N). Publish CI sets
# SETUPTOOLS_SCM_PRETEND_VERSION so wheels/sdists match the release tag.
# fallback_version is only used when git metadata is unavailable (e.g. sdist
# extract without .git). Keep it equal to the *next* unreleased patch.
# See docs/guides/VERSIONING.md
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:[.-].+)?)$"
local_scheme = "no-local-version"
fallback_version = "0.0.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# This suite exists specifically to assert that modules/symbols are importable,
# so the imports themselves are the test — they are not "unused".
"tests/test_import_compat.py" = ["F401"]
