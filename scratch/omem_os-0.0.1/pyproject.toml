[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools-rust", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omem*"]

[project]
name = "omem-os"
dynamic = ["version"]
description = "AI Memory Operating System — Graph-RAG, temporal truth maintenance, actionable schemas, selective encryption, sub-200ms hybrid retrieval."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Mohit Kumar Rajbadi", email = "mohitkumarrajbadi@gmail.com"}
]
keywords = [
    "ai", "memory", "rag", "vector-search", "embeddings", "llm", "agents",
    "memory-os", "compression", "reflection", "importance", "multi-agent",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "faiss-cpu>=1.7.4",
    "click>=8.0.0",
    "numba>=0.58.0",
    "xxhash>=3.0.0",
    "mcp>=1.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2.0"]
langchain = ["langchain>=0.1.0"]
external = ["openai>=1.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
all = [
    "sentence-transformers>=2.2.0",
    "langchain>=0.1.0",
    "numba>=0.58.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
omem = "omem.cli:main"

[project.urls]
Homepage = "https://github.com/mohitkumarrajbadi/omem"
Repository = "https://github.com/mohitkumarrajbadi/omem"
Issues = "https://github.com/mohitkumarrajbadi/omem/issues"
Changelog = "https://github.com/mohitkumarrajbadi/omem/releases"



[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
